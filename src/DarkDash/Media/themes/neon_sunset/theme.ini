; ============================================================
;  OG Xbox Isometric Dashboard  -  DEFAULT THEME
;  theme.ini  -  declarative theme contract (no scripting)
; ============================================================
;  This file is the engine contract. The dashboard reads it
;  once at boot, loads the referenced assets into a pinned RAM
;  pool, and lays out the screen from the [region:*] blocks.
;  Coordinates are authored in a virtual 640x480 space and
;  scaled to the active video mode. Origin is top-left.
;
;  Layering (painter's order, back -> front):
;    1. background   2. stage (iso set-dressing)
;    3. chrome (flat frames)   4. content (live text / cover art)
;    5. overlay (additive selection glow)
; ============================================================

[manifest]
schema_version = 1            ; bump when keys change; engine rejects unknown major
name           = Neon Sunset
author         = Darkone Customs / Team Resurgent
base_resolution = 640x480     ; virtual layout space
asset_dir      = assets

; ---- COLOR THEMING -----------------------------------------
; Single-hue UI -> the whole look is driven from here.
; The engine modulates neutral/grey art by 'accent'. Swap these
; four lines and you have a red / blue / amber variant for free.
[palette]
accent       = FF5CC6
accent_dim   = 7A2F67
glow         = FFB46B
text         = FFF0F8
text_dim     = D594BA
bg           = 0A0511

; ---- FONTS -------------------------------------------------
; Baked bitmap fonts at fixed sizes (sharp at 480i, free to draw).
; Provide your .xpr/.bmf here when produced; names are the contract.
[fonts]
title  = fonts/title_24.bmf
body   = fonts/body_16.bmf
small  = fonts/small_12.bmf

; ---- BACKGROUND MODULE -------------------------------------
; Selectable, parameterized. 'static' = single image.
; Other modules (plasma/galaxy/none) can be added later.
[background]
module    = static
image     = assets/bg.png
parallax  = 0.0                     ; 0 = fixed camera

; ---- ISO STAGE (set-dressing, composited as 2D sprites) -----
; Pure decoration. Authored screen positions; no 3D projection.
[stage]
orb        = orb_hero    ; x=232 y=40  anchor=top-center
platform   = platform_round

[stage.orb]
asset      = orb_hero
x          = 232
y          = 36
anchor     = center
; animation: light, not geometry (see [stage.orb.fx])
[stage.orb.fx]
pulse_hz       = 0.25        ; breathe rate of additive glow
swirl_scroll   = 0.05        ; uv scroll speed of energy layer
; (engine fakes motion over the static orb body; no frame seq)

; ---- MAIN MENU ---------------------------------------------
; Vertical list. Each item: id, label, icon, target screen.
; Selection = base frame + additive overlay_selection_glow.
[menu]
frame          = frame_menu_v
item_normal    = tab_v_normal
item_selected  = tab_v_selected
selection_glow         = FFB46B
x              = 360
y              = 70
item_height    = 34

[menu.items]
1 = games|GAMES|icon_games|screen_games
2 = apps|APPLICATIONS|icon_apps|screen_apps
3 = saves|SAVES|icon_saves|screen_saves
4 = media|MEDIA|icon_media|screen_media
5 = network|NETWORK|icon_network|screen_network
6 = settings|SETTINGS|icon_settings|screen_settings

; ---- STATIC CHROME REGIONS ---------------------------------
; frame = blank panel art (9-slice off if fixed-size).
; content slots are drawn flat on top in the content pass.
[region:header]
frame   = bar_header
x = 8   y = 8   w = 300 h = 40
content = signed_in            ; plaque_signedin style text block

[region:datetime]
frame   = plaque_datetime
x = 470 y = 8   w = 162 h = 40
content = clock

[region:recent]
frame   = frame_recent
x = 8   y = 250 w = 300 h = 150
content = recent_games         ; list of cover tiles (tile_cover_small_blank)
slots   = 4

[region:storage]
frame   = frame_storage
x = 318 y = 300 w = 150 h = 120
content = storage_bars         ; C: E: F: progress bars (live)

[region:status]
frame   = frame_status
x = 474 y = 300 w = 158 h = 120
content = system_status        ; cpu/gpu/mb/fan meters (live, from sensors)

[region:footer]
frame   = bar_footer
x = 8   y = 440 w = 624 h = 32
content = button_prompts       ; A select / B back / X system / Y view

; ---- CARD / TILE TEMPLATES ---------------------------------
; Used by content slots that show cover art. Art composites
; INTO the blank frame; text rides flat on top.
[card:cover]
frame   = frame_card_blank
art_inset = 6
[card:cover_small]
frame   = tile_cover_small_blank
[card:cover_medium]
frame   = tile_cover_medium_blank
[card:feature]
frame   = tile_feature_blank

; ---- SELECTION / STATE OVERLAYS ----------------------------
[overlays]
selection = overlay_selection_glow   ; additive; pulse via palette.glow
loading   = panel_loading
